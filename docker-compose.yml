version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8080
    depends_on:
      - redis
    networks:
      - counter-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - counter-network
    command: redis-server --appendonly yes
    restart: unless-stopped

networks:
  counter-network:
    driver: bridge

volumes:
  redis-data:
    driver: local